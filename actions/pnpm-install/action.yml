name: pnpm-install
description: Set up Node from the version file, enable pnpm through corepack, and install from the lockfile with a cached store.
# The pnpm version comes from packageManager in package.json.
inputs:
  working-directory: {description: Directory holding package.json and pnpm-lock.yaml, default: frontend}
  node-version-file: {description: Node version file, relative to the repo root, default: .nvmrc}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
    - shell: bash
      run: corepack enable
    - id: store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: pnpm-${{ runner.os }}-
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
