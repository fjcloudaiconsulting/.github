name: uv-sync
description: Install uv with its cache and sync the locked environment, with the venv on PATH.
# uv version: <working-directory>/.tool-versions (`uv X.Y.Z`) when present, else [tool.uv] required-version, else latest.
# .tool-versions pins CI without uv enforcing it on local runs, as required-version does. Python: .python-version.
# Keep .tool-versions to one uv line: no uv line fails setup-uv, and a python line would override .python-version.
inputs:
  working-directory: {description: Directory holding pyproject.toml and uv.lock, default: backend}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        working-directory: ${{ inputs.working-directory }}
        version-file: ${{ hashFiles(format('{0}/.tool-versions', inputs.working-directory)) != '' && '.tool-versions' || '' }}
        enable-cache: true
        # Relative to working-directory: setup-uv resolves the glob against it.
        cache-dependency-glob: uv.lock
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        uv sync --locked
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
