on:
  workflow_call:
    inputs:
      version: {type: string, required: true}
      health-url: {type: string, required: true}
      compose-file: {type: string, default: compose.smoke.yaml}

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: rel
        shell: bash
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          o=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.type + " " + .object.sha')
          read -r type rel <<<"$o"
          if [ "$type" = tag ]; then rel=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$rel" --jq .object.sha); fi
          [ -n "$rel" ] || { echo "cannot resolve tag v$VERSION" >&2; exit 1; }
          echo "sha=$rel" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rel.outputs.sha }}
          persist-credentials: false
      - shell: bash
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
      - name: Smoke test the published images
        shell: bash
        env:
          REL: ${{ steps.rel.outputs.sha }}
          HEALTH_URL: ${{ inputs.health-url }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          export IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,} TAG=v$VERSION
          trap 'docker compose logs || true; docker compose --profile "*" down -v' EXIT
          docker compose --profile '*' config --format json | jq -e --arg p "$IMAGE_PREFIX" --arg t "$TAG" \
            '[.services[] | select(has("build") or ((.image // "") | startswith($p + "/") and (endswith(":" + $t) | not)))] | length == 0' >/dev/null \
            || { echo "compose must use $IMAGE_PREFIX/*:$TAG images only, no build:" >&2; exit 1; }
          docker compose --profile migrate run --rm migrations
          docker compose --profile migrate run --rm migrations
          docker compose up -d --wait
          curl -sf --retry 30 --retry-all-errors --retry-delay 2 "$HEALTH_URL" \
            | jq -e --arg v "$VERSION" --arg sha "$REL" '.version == $v and .revision == $sha'
